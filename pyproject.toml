[project]
name = "afhverju-abra"
version = "0.2.0"
description = "Karaoke music video pipeline for the Icelandic kids' science song Aravísur (Afhverju Abra) — forced-aligned animated lyrics + beat-synced crossfades."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rationallyprime" }]
keywords = ["music-video", "karaoke", "forced-alignment", "ffmpeg", "icelandic"]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "librosa>=0.11",
    "soundfile>=0.13",
    "pillow>=11",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "ctc-forced-aligner>=1.0.2",
    "unidecode>=1.3",
    "huggingface-hub>=0.30",
]

[tool.uv]
package = false

# torch/torchaudio come from the CUDA 12.4 wheel index, not PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# the pipeline scripts run top-to-bottom; allow a little script-style latitude.
ignore = ["E501"]
